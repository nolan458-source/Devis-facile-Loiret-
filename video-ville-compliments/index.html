    if (t > S('cpt') + .5) confetti.forEach((m, i) => { m.visible = true; const ph = ((t - S('cpt')) * .3 + rnd(i)) % 1; m.position.set(114 + rnd(i + 3) * 12, 14 - ph * 14, -3 + rnd(i + 7) * 9); m.rotation.set(t * 3 + i, t * 2 + i, 0); });
  }
  // --- finale
  if (t > S('fin') - .3) {
    const k = prog(t, S('fin'), S('fin') + 1.6);
    P(noe, { x: -7, z: lerp(4, 1.6, ease(k)), s: 3.0, walk: k < 1 ? t * 5 : 0, bend: k >= 1 ? .45 : 0, headX: k >= 1 ? .35 : 0, arms: k >= 1 ? [[.4, -.9], [.4, -.9]] : [0, 0],
      face: { eyes: k >= 1 ? 'wide' : 'happy', mouth: k >= 1 ? 'wavy' : 'grin', brow: k >= 1 ? -1 : 0, freckles: true, blush: true } });
    pigeon.visible = true; const ph = prog(t, S('fin') + 1.8, S('fin') + 2.6);
    pigeon.scale.setScalar(.9); pigeon.rotation.y = -1.6;
    const hp = headTop(noe, .05); pigeon.position.set(lerp(-2, hp.x, ease(ph)), lerp(14, hp.y, ease(ph)) + Math.sin(ph * Math.PI) * 2, lerp(2, hp.z, ease(ph)));
  }
  for (const c of clouds) c.visible = evening;
}

function overlay(t) {
  // labels & bubbles
  if (t > WT('hook', /^trois/) - .1 && t < S('noe') - .1) label(max, '3 m 00', '#ffffff', 1.0, 46);
  if (t > WT('noe', /^mesure/) && t < S('mamie')) label(noe, '1 m 10', '#ffffff', 1.0, 46);
  bubbleOn(girl, 'Trop stylé, Max !', t < E('c1') + .6 ? prog(t, S('c1') - .1, S('c1') + .1) : 0);
  bubbleOn(mamie, 'Qu’il est beau, mon trésor !', t < E('chien') + .3 ? prog(t, S('g1') - .1, S('g1') + .1) : 0, 1.1);
  bubbleOn(kids[1], 'Trop fort, Max !', t < E('c2') + .5 ? prog(t, S('c2') - .1, S('c2') + .1) : 0);
  bubbleOn(noe, 'Madame, votre pain, c’est le meilleur de la ville !', t < E('o1') + .3 ? prog(t, S('o1') - .1, S('o1') + .1) : 0, 1.2);
  bubbleOn(noe, 'Monsieur le facteur, vous courez super vite !', t < E('o2') + .3 ? prog(t, S('o2') - .1, S('o2') + .1) : 0, 1.2);
  bubbleOn(baker, 'Noé, t’es le garçon le plus gentil de la ville !', t < E('b1') + .2 ? prog(t, S('b1') - .1, S('b1') + .1) : 0, 1.3);
  bubbleOn(facteur, 'Merci pour tout, Noé !', t < E('p1') + .2 ? prog(t, S('p1') - .1, S('p1') + .1) : 0, 1.0);
  bubbleOn(max, 'Euh… t’es vraiment grand, Noé.', t < E('x1') + .4 ? prog(t, S('x1') - .1, S('x1') + .1) : 0, 1.0);
  if (t > S('idee') + .2 && t < WT('idee', /^Si$/)) { const [x, y] = proj(headTop(noe, 1.0)); const g = back(prog(t, S('idee') + .2, S('idee') + .5));
    ctx.save(); ctx.translate(x, y - 20); ctx.scale(g, g); ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = '#1e1a22'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, -20, 38, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#c9c9d2'; ctx.fillRect(-16, 14, 32, 22); ctx.strokeRect(-16, 14, 32, 22);
    for (let i = 0; i < 8; i++) { const a = i / 8 * 6.28; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 52, -20 + Math.sin(a) * 52); ctx.lineTo(Math.cos(a) * 68, -20 + Math.sin(a) * 68); ctx.stroke(); } ctx.restore(); }
  if (t > S('ecole') + L.ecole.dur * .7 && t < S('c2') - .1) { const [x, y] = proj(headTop(max, .4)); for (let i = 0; i < 5; i++) { const a = t * 6 + i * 1.256; text2('★', x + Math.cos(a) * 60, y - 30 + Math.sin(a) * 18, 34, '#ffe14d', { lw: 6, font: 'Nun' }); } }
  pops(t);
  caption(t);
}
function buildPops() {
  const add = (t, c, o = {}) => POPS.push(Object.assign({ t, c }, o));
  add(WT('hook', /^grandir/), max, { ox: -60 }); add(WT('hook', /^centimètre/), max, { ox: 60 }); add(S('hook') + 3.6, max, { ox: -20 });
  add(S('c1') + .4, max, { ox: 40 }); add(WT('noe', /^personne/) + .1, noe, { txt: '+0 cm', col: '#ff4d4d', dy: .9 });
  add(S('chien') + .1, dog, { dy: 1.2 }); add(S('c2') + .5, max, {});
  add(E('o1') - .4, baker, {}); add(E('o2') - .3, facteur, {});
  [0, 1, 2].forEach(i => add(S('tous') + .4 + i * .45, crowd[i + 2], {}));
  add(WT('tous', /^pigeons/) + .2, pigeon, { dy: .9 }); add(WT('tous', /^Sauf/) + .2, noe, { txt: '+0 cm', col: '#ff4d4d', dy: .9 });
  add(S('b1') + .5, noe, { size: 1.3 }); add(S('p1') + .2, noe, { size: 1.3, ox: 40 });
  for (let i = 0; i < 40; i++) add(S('cpt') + .3 + i * .09, noe, { ox: (rnd(i) - .5) * 360, oy: (rnd(i + 9) - .5) * 260, dy: .4, size: .8 + rnd(i + 2) * .5 });
  add(S('x1') + .8, noe, { size: 1.4, ox: -80, dy: .2 });
}
function render(t) {
  update(t); applyCamera(t); renderer.render(scene, camera);
  ctx.drawImage(renderer.domElement, 0, 0); overlay(t);
  const tl = TL.total; if (t > tl - .5) { ctx.fillStyle = `rgba(0,0,0,${prog(t, tl - .5, tl)})`; ctx.fillRect(0, 0, W, H); }
}
window.init = async tl => {
  TL = tl; L = {}; tl.lines.forEach(l => L[l.id] = l); SH = shots(); buildPops();
